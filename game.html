<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit Snake — built from one prompt</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0b0b12;
    color: #e5e7eb;
    font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 16px;
  }
  h1 { font-size: 26px; letter-spacing: 4px; color: #a3e635; }
  h1 span { color: #f472b6; }
  #hud {
    display: flex;
    gap: 28px;
    font-size: 17px;
    color: #9ca3af;
  }
  #hud b { color: #f8fafc; }
  #hud .score b { color: #4ade80; }
  canvas {
    background: #10101a;
    border: 2px solid #26263a;
    border-radius: 12px;
    box-shadow: 0 0 42px rgba(74, 222, 128, 0.14);
    max-width: 92vw;
    max-height: 62vh;
    touch-action: none;
  }
  #pad {
    display: grid;
    grid-template-columns: repeat(3, 62px);
    grid-template-rows: repeat(2, 52px);
    gap: 8px;
  }
  #pad button {
    background: #1c1c2c;
    color: #e5e7eb;
    border: 1px solid #33334a;
    border-radius: 10px;
    font-size: 22px;
    font-family: inherit;
    cursor: pointer;
  }
  #pad button:active { background: #4ade80; color: #0b0b12; }
  #up { grid-column: 2; grid-row: 1; }
  #left { grid-column: 1; grid-row: 2; }
  #down { grid-column: 2; grid-row: 2; }
  #right { grid-column: 3; grid-row: 2; }
  #hint { font-size: 13px; color: #6b7280; text-align: center; }
  #hint kbd {
    background: #1c1c2c;
    border: 1px solid #33334a;
    border-radius: 5px;
    padding: 1px 7px;
    color: #d1d5db;
  }
</style>
</head>
<body>
  <h1>ORBIT <span>SNAKE</span></h1>
  <div id="hud">
    <span class="score">SCORE <b id="score">0</b></span>
    <span>BEST <b id="best">0</b></span>
    <span>SPEED <b id="speed">1</b></span>
  </div>
  <canvas id="game" width="600" height="600"></canvas>
  <div id="pad">
    <button id="up" aria-label="up">&#9650;</button>
    <button id="left" aria-label="left">&#9664;</button>
    <button id="down" aria-label="down">&#9660;</button>
    <button id="right" aria-label="right">&#9654;</button>
  </div>
  <p id="hint"><kbd>&#8592;</kbd><kbd>&#8593;</kbd><kbd>&#8595;</kbd><kbd>&#8594;</kbd> or WASD to steer &middot; <kbd>P</kbd> pause &middot; <kbd>R</kbd> restart</p>

<script>
"use strict";

// Orbit Snake — a tiny browser game built from ONE prompt:
// "Build a tiny browser game in one single HTML file, no libraries: a snake
//  that eats glowing orbs, grows longer and speeds up with every orb, arrow
//  keys or WASD to steer, a score counter, and a game-over screen with restart."

var COLS = 20;
var ROWS = 20;
var CELL = 30;

var canvas = document.getElementById("game");
var ctx = canvas.getContext("2d");
var scoreEl = document.getElementById("score");
var bestEl = document.getElementById("best");
var speedEl = document.getElementById("speed");

var snake;      // array of {x, y}, head first
var dir;        // {x, y}
var pending;    // queued direction changes
var orb;        // {x, y}
var score;
var best = 0;
var alive;
var paused;
var tickMs;
var lastTick;
var glowPhase = 0;

try { best = parseInt(window.localStorage.getItem("orbit-snake-best") || "0", 10) || 0; }
catch (e) { best = 0; }
bestEl.textContent = best;

function reset() {
  snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
  dir = { x: 1, y: 0 };
  pending = [];
  score = 0;
  alive = true;
  paused = false;
  tickMs = 125; // 8 moves per second at start
  lastTick = 0;
  placeOrb();
  scoreEl.textContent = "0";
  speedEl.textContent = "1";
}

function placeOrb() {
  var free = [];
  for (var x = 0; x < COLS; x++) {
    for (var y = 0; y < ROWS; y++) {
      if (!onSnake(x, y)) free.push({ x: x, y: y });
    }
  }
  if (free.length === 0) { orb = null; return; }
  orb = free[Math.floor(Math.random() * free.length)];
}

function onSnake(x, y) {
  for (var i = 0; i < snake.length; i++) {
    if (snake[i].x === x && snake[i].y === y) return true;
  }
  return false;
}

function queueDir(x, y) {
  var last = pending.length ? pending[pending.length - 1] : dir;
  if (x === -last.x && y === -last.y) return; // no reversing into yourself
  if (x === last.x && y === last.y) return;   // no duplicate
  if (pending.length < 3) pending.push({ x: x, y: y });
}

function step() {
  if (pending.length) dir = pending.shift();
  var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  // Walls and self are deadly.
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS || onSnake(head.x, head.y)) {
    alive = false;
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      try { window.localStorage.setItem("orbit-snake-best", String(best)); } catch (e) {}
    }
    return;
  }

  snake.unshift(head);
  if (orb && head.x === orb.x && head.y === orb.y) {
    score += 1;
    scoreEl.textContent = score;
    speedEl.textContent = String(1 + Math.floor(score / 3));
    tickMs = Math.max(55, 125 - score * 4); // faster with every orb: 8 moves/s at start, up to ~18/s
    placeOrb();
  } else {
    snake.pop();
  }
}

function drawGrid() {
  ctx.strokeStyle = "#181826";
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (var x = 1; x < COLS; x++) {
    ctx.moveTo(x * CELL + 0.5, 0);
    ctx.lineTo(x * CELL + 0.5, ROWS * CELL);
  }
  for (var y = 1; y < ROWS; y++) {
    ctx.moveTo(0, y * CELL + 0.5);
    ctx.lineTo(COLS * CELL, y * CELL + 0.5);
  }
  ctx.stroke();
}

function drawOrb() {
  if (!orb) return;
  var cx = orb.x * CELL + CELL / 2;
  var cy = orb.y * CELL + CELL / 2;
  var pulse = 9 + Math.sin(glowPhase) * 2.5;
  var glow = ctx.createRadialGradient(cx, cy, 2, cx, cy, 26);
  glow.addColorStop(0, "rgba(244, 114, 182, 0.85)");
  glow.addColorStop(0.45, "rgba(244, 114, 182, 0.25)");
  glow.addColorStop(1, "rgba(244, 114, 182, 0)");
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(cx, cy, 26, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#f472b6";
  ctx.beginPath();
  ctx.arc(cx, cy, pulse, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#fbcfe8";
  ctx.beginPath();
  ctx.arc(cx - 3, cy - 3, 3, 0, Math.PI * 2);
  ctx.fill();
}

function drawSnake() {
  for (var i = snake.length - 1; i >= 0; i--) {
    var seg = snake[i];
    var px = seg.x * CELL;
    var py = seg.y * CELL;
    if (i === 0) {
      ctx.fillStyle = "#a3e635";
      roundRect(px + 2, py + 2, CELL - 4, CELL - 4, 8);
      ctx.fill();
      // eyes look where the snake is heading
      ctx.fillStyle = "#0b0b12";
      var ex = px + CELL / 2 + dir.x * 6;
      var ey = py + CELL / 2 + dir.y * 6;
      ctx.beginPath();
      ctx.arc(ex - 5, ey - 4, 2.6, 0, Math.PI * 2);
      ctx.arc(ex + 5, ey - 4, 2.6, 0, Math.PI * 2);
      ctx.fill();
    } else {
      var fade = 1 - (i / snake.length) * 0.55;
      ctx.fillStyle = "rgba(74, 222, 128, " + fade.toFixed(2) + ")";
      roundRect(px + 3, py + 3, CELL - 6, CELL - 6, 7);
      ctx.fill();
    }
  }
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawOverlay(title, sub) {
  ctx.fillStyle = "rgba(11, 11, 18, 0.78)";
  ctx.fillRect(0, 0, COLS * CELL, ROWS * CELL);
  ctx.textAlign = "center";
  ctx.fillStyle = "#f8fafc";
  ctx.font = "bold 44px 'JetBrains Mono', monospace";
  ctx.fillText(title, COLS * CELL / 2, ROWS * CELL / 2 - 8);
  ctx.fillStyle = "#9ca3af";
  ctx.font = "20px 'JetBrains Mono', monospace";
  ctx.fillText(sub, COLS * CELL / 2, ROWS * CELL / 2 + 34);
}

function draw(now) {
  ctx.clearRect(0, 0, COLS * CELL, ROWS * CELL);
  drawGrid();
  drawOrb();
  drawSnake();
  if (!alive) drawOverlay("GAME OVER", "score " + score + "  ·  press R to play again");
  else if (paused) drawOverlay("PAUSED", "press P to resume");
}

function loop(now) {
  glowPhase += 0.08;
  if (alive && !paused) {
    if (!lastTick) lastTick = now;
    if (now - lastTick >= tickMs) {
      step();
      lastTick = now;
    }
  }
  draw(now);
  window.requestAnimationFrame(loop);
}

document.addEventListener("keydown", function (e) {
  var k = e.key;
  if (k === "ArrowUp" || k === "w" || k === "W") { queueDir(0, -1); e.preventDefault(); }
  else if (k === "ArrowDown" || k === "s" || k === "S") { queueDir(0, 1); e.preventDefault(); }
  else if (k === "ArrowLeft" || k === "a" || k === "A") { queueDir(-1, 0); e.preventDefault(); }
  else if (k === "ArrowRight" || k === "d" || k === "D") { queueDir(1, 0); e.preventDefault(); }
  else if (k === "p" || k === "P" || k === " ") { if (alive) paused = !paused; e.preventDefault(); }
  else if (k === "r" || k === "R" || k === "Enter") { if (!alive) reset(); }
});

function bindPad(id, x, y) {
  var btn = document.getElementById(id);
  btn.addEventListener("click", function () { queueDir(x, y); });
}
bindPad("up", 0, -1);
bindPad("down", 0, 1);
bindPad("left", -1, 0);
bindPad("right", 1, 0);

canvas.addEventListener("click", function () {
  if (!alive) reset();
});

reset();
window.requestAnimationFrame(loop);
</script>
</body>
</html>
